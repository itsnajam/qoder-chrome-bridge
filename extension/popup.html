<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chrome Bridge by Najam</title>
    <style>
      :root {
        --navy: #0b1f3a;
        --blue: #2563eb;
        --sky: #7dd3fc;
        --ink: #101828;
        --muted: #5b6472;
        --line: #e4e7ec;
        --ok: #1f7a3d;
        --bad: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #fff;
      }
      header {
        background: var(--navy);
        color: #fff;
        padding: 14px 16px 12px;
      }
      h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
      .status { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: #dbe7ff; font-size: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f97066; flex: none; }
      .dot.on { background: #4ade80; }
      main { padding: 14px 16px 16px; }
      label { display: block; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, monospace;
        color: var(--ink);
      }
      input:focus { outline: 2px solid #bfdbfe; border-color: var(--blue); }
      .row { display: flex; gap: 8px; }
      .row label:first-child { flex: 1; }
      .row label:last-child { width: 96px; }
      button {
        width: 100%;
        padding: 8px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #f8fafc; }
      button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
      button.primary:hover { background: #1d4ed8; }
      .actions { display: flex; gap: 8px; margin-top: 2px; }
      .actions button { flex: 1; }
      .hint { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; }
      .hint code {
        font: 11px/1.4 ui-monospace, SFMono-Regular, monospace;
        background: #f2f4f7;
        padding: 1px 4px;
        border-radius: 3px;
      }
      .err { margin: 8px 0 0; color: var(--bad); font-size: 12px; word-break: break-word; }
      .ok { color: var(--ok); }
      .promo {
        margin-top: 14px;
        padding: 13px 14px;
        border-radius: 10px;
        background: linear-gradient(145deg, #0b1f3a 0%, #123a6b 55%, #1d4ed8 100%);
        color: #fff;
      }
      .promo p { margin: 0 0 9px; font-size: 12.5px; line-height: 1.4; color: #e6efff; }
      .promo strong { display: block; color: #fff; font-size: 13px; margin-bottom: 3px; }
      .promo a {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 6px;
        background: var(--sky);
        color: var(--navy);
        font-weight: 600;
        font-size: 12px;
        text-decoration: none;
      }
      .promo a:hover { background: #bae6fd; }
      footer { padding: 10px 16px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      footer a { color: var(--blue); text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chrome Bridge by Najam</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="label">Checking...</span></div>
    </header>
    <main>
      <div class="row">
        <label>Bridge token
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the token" />
        </label>
        <label>Port
          <input id="port" type="number" min="1" max="65535" placeholder="8791" />
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="save">Save and connect</button>
        <button id="reconnect">Reconnect</button>
      </div>
      <p class="hint" id="hint">Get the token from the bridge: <code>node server.mjs --token</code></p>
      <p class="err" id="error"></p>
      <p class="err ok" id="saved"></p>
      <div class="promo">
        <p><strong>Need a website, an app or AI automation?</strong>I build them for founders and small teams. Tell me what you need.</p>
        <a href="https://najam.dev" target="_blank" rel="noopener">najam.dev</a>
      </div>
    </main>
    <footer>Built by Muhammad Najam Ul Hassan · <a href="https://najam.dev" target="_blank" rel="noopener">najam.dev</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
